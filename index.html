<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شكرًا لتسجيلك</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg,#eaf8ef,#f4f7fb);
  color: #19452f;
}
.card {
  width: 100%;
  max-width: 430px;
  text-align: center;
  padding: 35px 22px;
  border-radius: 24px;
  background: white;
  box-shadow: 0 15px 45px #174b3215;
  animation: appear .7s ease-out;
}
.check {
  width: 82px;
  height: 82px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #ddf7e7;
  color: #16834b;
  font-size: 44px;
  animation: pop .6s ease-out;
}
h1 { font-size: 25px; line-height: 1.7; }
p { color: #607267; font-size: 16px; line-height: 2; }
.line {
  width: 55px; height: 4px; margin: 23px auto;
  border-radius: 5px; background: #28a568;
}
.brand { font-weight: bold; line-height: 1.9; }
.motto { font-size: 13px; color: #87958b; }
@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pop {
  from { transform: scale(.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <h1>تم استلام تسجيلك بنجاح</h1>
  <p>شكرًا لثقتك بنا. لقد وصل تسجيلك إلى اتحاد الأيدي العاملة للتوظيف والموارد البشرية.</p>
  <p>نسعى إلى ربط أصحاب الأعمال بالباحثين عن فرص عمل مناسبة.</p>
  <div class="line"></div>
  <div class="brand">اتحاد الأيدي العاملة للتوظيف والموارد البشرية</div>
  <p class="motto">نحو فرص عمل أفضل</p>
</main>
</body>
</html>
